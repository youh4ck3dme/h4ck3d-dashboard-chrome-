# Development environment for the Base44 sandbox.
# Runs the Vite dev server straight from the mounted source so edits show up live.
name: h4ck3d-dashboard

services:
  web:
    image: node:22
    working_dir: /app
    command:
      - sh
      - -ec
      - |
        npm ci --no-audit --no-fund
        exec npm run dev -- --host 0.0.0.0 --port 3000
    environment:
      # Platform-supplied values, passed through so Vite accepts the preview host.
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - BASE44_PUBLIC_HOST_SUFFIX
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    labels:
      base44.project: 'H4CK3D Dashboard Timeline'
      base44.kind: web
      base44.port: '3000'
    restart: on-failure
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r=>r.ok?r.text():Promise.reject(r.status)).then(t=>process.exit(t.includes('id=\"root\"')?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 6

volumes:
  web_node_modules:
